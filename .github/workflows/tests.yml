name: tests

on:
  push:
    branches: [main, 3.x]
  pull_request:

jobs:
  tests:
    # Pinned: "ubuntu-latest" moves to a new release on a date of GitHub's choosing, and a red build should mean the package.
    runs-on: ubuntu-24.04
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        db: [sqlite, pgsql, mysql]
        include:
          # No MariaDB to verify on locally. It runs and reports, and does not turn the badge red
          # until it has passed here once; then move it into "db" above.
          - { php: '8.4', db: mariadb, experimental: true }

    continue-on-error: ${{ matrix.experimental == true }}

    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: secret, POSTGRES_DB: acr_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: secret, MYSQL_DATABASE: acr_test }
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -psecret" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: secret, MARIADB_DATABASE: acr_test }
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, zip, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests
        run: ./vendor/bin/phpunit
        env:
          DB_CONNECTION: ${{ matrix.db == 'mariadb' && 'mariadb' || matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || (matrix.db == 'mariadb' && '3307' || '3306') }}
          DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'acr_test' }}
          DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: secret
